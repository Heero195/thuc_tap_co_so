<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jira UI • Sign in</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
          <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
            <div class="brand-badge">J</div>
            <div>
              <div class="h4 mb-0">Jira Clone</div>
              <!-- <div class="app-muted small">Đăng nhập qua API • cần Spring Boot chạy tại <code class="small">localhost:8080</code></div> -->
            </div>
          </div>

          <div class="app-card rounded-4 p-4 p-md-5">
            <div class="d-flex align-items-start justify-content-between mb-3">
              <div>
                <div class="h5 mb-1">Đăng nhập</div>
                <div class="app-muted small">Nhập thông tin để vào dashboard.</div>
              </div>
              <span class="chip"><span class="status-dot inprogress"></span> Demo</span>
            </div>

            <form id="signInForm" class="mt-4">
              <div class="mb-3">
                <label class="form-label app-muted">Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-white border-opacity-25"><i class="bi bi-envelope"></i></span>
                  <input class="form-control" type="email" name="email" placeholder="demo@local.test" required />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label app-muted">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-white border-opacity-25"><i class="bi bi-lock"></i></span>
                  <input class="form-control" type="password" name="password" placeholder="••••••••" minlength="6" required />
                </div>
                <!-- <div class="form-text app-muted">Dùng email và mật khẩu tài khoản trong database (≥ 6 ký tự). Mở trang qua Live Server hoặc <code class="small">http://</code> — tránh mở file trực tiếp <code class="small">file://</code> nếu gặp lỗi.</div> -->
              </div>

              <button class="btn btn-primary w-100 py-2" type="submit">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
              </button>
            </form>

            <div class="d-flex align-items-center justify-content-between mt-4">
              <!-- <a class="app-link small" href="dashboard.html">Vào thẳng dashboard</a> -->
              <a class="app-link small" href="sign-up.html">Tạo tài khoản</a>
            </div>
          </div>

          <div class="text-center app-muted small mt-4">
            <!-- <span class="kbd-hint">Ctrl</span> + <span class="kbd-hint">K</span> (trong dashboard để focus search) -->
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
