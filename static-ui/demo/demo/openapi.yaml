openapi: 3.0.3
info:
  title: Static UI Bug Tracker API
  version: 0.1.0
  description: >
    Simplified API contract for backend implementation.
    Covers auth, users, workspaces, bugs, comments, attachments, dashboard.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Users
  - name: Workspaces
  - name: Bugs
  - name: Comments
  - name: Attachments
  - name: Dashboard
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRes'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register user and return JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserReq'
      responses:
        '200':
          description: Register success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRes'
        '400':
          description: Validation or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile from JWT
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized

  /users:
    get:
      tags: [Users]
      summary: List users (ADMIN)
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags: [Users]
      summary: Create user (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserReq'
      responses:
        '200':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Validation or duplicate email

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by id
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Update user (ADMIN)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserReq'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Delete user (ADMIN)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Delete success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Delete success
        '409':
          description: User is referenced by bugs/comments

  /users/upload:
    post:
      tags: [Users]
      summary: Upload file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileData:
                  type: string
                  format: binary
      responses:
        '200':
          description: Relative file URL
          content:
            text/plain:
              schema:
                type: string
                example: /users/file/avatar.png

  /users/file/{filename}:
    get:
      tags: [Users]
      summary: Download uploaded file
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /api/workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
    post:
      tags: [Workspaces]
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceReq'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'

  /api/workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get workspace detail
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          description: Workspace not found
    put:
      tags: [Workspaces]
      summary: Update workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceReq'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
    delete:
      tags: [Workspaces]
      summary: Delete workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Workspace deleted

  /api/workspaces/{id}/members:
    get:
      tags: [Workspaces]
      summary: List workspace members
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
    post:
      tags: [Workspaces]
      summary: Add member to workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId:
                  type: integer
                role:
                  type: string
                  example: developer
      responses:
        '200':
          description: Member added

  /api/workspaces/{id}/members/{userId}:
    delete:
      tags: [Workspaces]
      summary: Remove member from workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Member removed

  /api/bugs:
    get:
      tags: [Bugs]
      summary: List/filter bugs
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, inprogress, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: assigneeId
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Bug list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBugRes'
    post:
      tags: [Bugs]
      summary: Create bug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBugReq'
      responses:
        '201':
          description: Bug created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bug'

  /api/bugs/{id}:
    get:
      tags: [Bugs]
      summary: Get bug detail
      parameters:
        - $ref: '#/components/parameters/BugId'
      responses:
        '200':
          description: Bug detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugDetailRes'
        '404':
          description: Bug not found
    put:
      tags: [Bugs]
      summary: Update bug
      parameters:
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBugReq'
      responses:
        '200':
          description: Bug updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bug'
    delete:
      tags: [Bugs]
      summary: Delete bug
      parameters:
        - $ref: '#/components/parameters/BugId'
      responses:
        '204':
          description: Bug deleted
        '409':
          description: Delete rule violation

  /api/bugs/{id}/status:
    patch:
      tags: [Bugs]
      summary: Update bug status quickly
      parameters:
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, inprogress, resolved, closed]
      responses:
        '200':
          description: Status updated

  /api/bugs/{id}/assignee:
    patch:
      tags: [Bugs]
      summary: Assign/unassign bug
      parameters:
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Assignee updated

  /api/bugs/{bugId}/comments:
    get:
      tags: [Comments]
      summary: List comments by bug
      parameters:
        - $ref: '#/components/parameters/BugIdPathNamed'
      responses:
        '200':
          description: Comment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      tags: [Comments]
      summary: Add comment to bug
      parameters:
        - $ref: '#/components/parameters/BugIdPathNamed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

  /api/comments/{id}:
    put:
      tags: [Comments]
      summary: Update comment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Comment updated
    delete:
      tags: [Comments]
      summary: Delete comment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Comment deleted

  /api/bugs/{bugId}/attachments:
    get:
      tags: [Attachments]
      summary: List attachments by bug
      parameters:
        - $ref: '#/components/parameters/BugIdPathNamed'
      responses:
        '200':
          description: Attachment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
    post:
      tags: [Attachments]
      summary: Upload attachment for bug
      parameters:
        - $ref: '#/components/parameters/BugIdPathNamed'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'

  /api/attachments/{id}/download:
    get:
      tags: [Attachments]
      summary: Download attachment by id
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Attachment not found

  /api/attachments/{id}:
    delete:
      tags: [Attachments]
      summary: Delete attachment by id
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: Attachment deleted

  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Summary count by status
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
      responses:
        '200':
          description: Status summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  open:
                    type: integer
                  inprogress:
                    type: integer
                  resolved:
                    type: integer
                  closed:
                    type: integer

  /api/dashboard/by-priority:
    get:
      tags: [Dashboard]
      summary: Bug count by priority
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
      responses:
        '200':
          description: Priority summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  high:
                    type: integer
                  medium:
                    type: integer
                  low:
                    type: integer

  /api/dashboard/by-developer:
    get:
      tags: [Dashboard]
      summary: Bug count by assignee
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
      responses:
        '200':
          description: Assignee summary
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    assigneeId:
                      type: integer
                      nullable: true
                    assigneeName:
                      type: string
                    count:
                      type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WorkspaceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WorkspaceIdQuery:
      name: workspaceId
      in: query
      required: false
      schema:
        type: integer
    BugId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    BugIdPathNamed:
      name: bugId
      in: path
      required: true
      schema:
        type: integer
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AttachmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Validation failed

    LoginReq:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4

    CreateUserReq:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4
        role:
          type: string
          example: developer
        phone:
          type: string
          example: "0912345678"

    UpdateUserReq:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 4
        role:
          type: string
        phone:
          type: string
        avatar:
          type: string

    UserDto:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        phone:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true

    AuthRes:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'

    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateWorkspaceReq:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateWorkspaceReq:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Bug:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: BUG-10
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, inprogress, resolved, closed]
        reporterId:
          type: integer
        assigneeId:
          type: integer
          nullable: true
        workspaceId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateBugReq:
      type: object
      required: [title, workspaceId]
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        status:
          type: string
          enum: [open, inprogress, resolved, closed]
          default: open
        assigneeId:
          type: integer
          nullable: true
        workspaceId:
          type: integer

    UpdateBugReq:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, inprogress, resolved, closed]
        assigneeId:
          type: integer
          nullable: true

    Comment:
      type: object
      properties:
        id:
          type: integer
        bugId:
          type: integer
        userId:
          type: integer
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        id:
          type: integer
        bugId:
          type: integer
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time

    BugDetailRes:
      allOf:
        - $ref: '#/components/schemas/Bug'
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'

    PagedBugRes:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Bug'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
